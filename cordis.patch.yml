# One install adds:
#   1. the local FightClub stdio MCP server
#   2. the bundled FightClub skill provider
#
# The first launch of the MCP server needs credentials:
#   npx fightclub-mcp auth
- insert:
    - id: fightclub-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fightclub
        transport: stdio
        command: npx
        args: ['-y', 'fightclub-mcp@0.1.3']
        failOnStartupError: false
    - id: fightclub-skill
      name: fightclub-dsh
